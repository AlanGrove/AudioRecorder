name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read version from tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v((?:0|[1-9][0-9]{0,4})(?:\.(?:0|[1-9][0-9]{0,4})){0,3})$') {
            throw "Tag must contain only a Chrome extension version prefixed with v."
          }
          $version = $Matches[1]
          $parts = @($version.Split('.') | ForEach-Object { [int]$_ })
          if (($parts | Where-Object { $_ -gt 65535 }).Count -gt 0 -or ($parts | Measure-Object -Sum).Sum -eq 0) {
            throw "Version components must be 0..65535 and not all zero."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/validate-release.ps1 -ExpectedVersion $env:RELEASE_VERSION

      - name: Build extension ZIP
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $outputs = Join-Path $PWD "outputs"
          $stage = Join-Path $outputs "release-stage"
          $zipPath = Join-Path $outputs "AudioRecorder_V$version.zip"
          if (Test-Path -LiteralPath $stage) {
            throw "Release stage already exists. Refusing to overwrite it."
          }
          New-Item -ItemType Directory -Path $stage | Out-Null
          $include = @(
            "manifest.json",
            "AudioRecorder.html",
            "AudioRecorder.js",
            "google-drive.js",
            "drive-backend-config.js",
            "google-drive.css",
            "recording-library.js",
            "recording-recovery.js",
            "input-devices.js",
            "recording-library.css",
            "recorder.css",
            "AudioRecorderWorklet.js",
            "background.js",
            "lamejs.iife.js",
            "LICENSE-lamejs.iife.js.txt",
            "links.txt",
            "README.md",
            "PRIVACY.md",
            "CHANGELOG.md",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "icons",
            "shared"
          )
          foreach ($item in $include) {
            Copy-Item -LiteralPath (Join-Path $PWD $item) -Destination $stage -Recurse -Force
          }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zipPath -Force
          "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      - name: Validate ZIP
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/validate-release.ps1 -ExpectedVersion $env:RELEASE_VERSION -PackagePath $env:ZIP_PATH

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.ZIP_PATH }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true

